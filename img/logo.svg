<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="t d">
  <title id="t">El Regalo</title>
  <desc id="d">Barranquero (Momotus momota) posado en una rama de café con frutos rojos y flores blancas, dentro de un sello con los colores de Colombia. Inspirado en el mural del restaurante.</desc>
  <defs>
    <linearGradient id="wing" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#3FA9E0"/>
      <stop offset="0.55" stop-color="#1F6FC4"/>
      <stop offset="1" stop-color="#14408F"/>
    </linearGradient>
    <linearGradient id="tail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F5FB8"/>
      <stop offset="1" stop-color="#2E86D6"/>
    </linearGradient>
    <linearGradient id="chest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8DBF3F"/>
      <stop offset="0.6" stop-color="#5FA347"/>
      <stop offset="1" stop-color="#2F8A8A"/>
    </linearGradient>
    <radialGradient id="cherry" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#F0505A"/>
      <stop offset="1" stop-color="#A3101C"/>
    </radialGradient>
    <g id="leaf">
      <path d="M0 0C10-12 32-12 44 0 32 12 10 12 0 0z" fill="#3E9A4C"/>
      <path d="M0 0C10-12 32-12 44 0" fill="#56B060" opacity=".6"/>
      <path d="M2 0H42" stroke="#2A6E35" stroke-width="1.6"/>
    </g>
    <g id="flower" fill="#FFFFFF" stroke="#D9DDE3" stroke-width=".8">
      <ellipse cx="0" cy="-6" rx="2.6" ry="6"/>
      <ellipse cx="0" cy="-6" rx="2.6" ry="6" transform="rotate(72)"/>
      <ellipse cx="0" cy="-6" rx="2.6" ry="6" transform="rotate(144)"/>
      <ellipse cx="0" cy="-6" rx="2.6" ry="6" transform="rotate(216)"/>
      <ellipse cx="0" cy="-6" rx="2.6" ry="6" transform="rotate(288)"/>
      <circle r="1.8" fill="#F4E3A1" stroke="none"/>
    </g>
  </defs>

  <!-- Sello tricolor -->
  <circle cx="128" cy="128" r="126" fill="#FCD116"/>
  <path d="M2 128h252a126 126 0 0 1-32 84H34A126 126 0 0 1 2 128z" fill="#003893"/>
  <path d="M34 212h188a126 126 0 0 1-188 0z" fill="#CE1126"/>
  <circle cx="128" cy="128" r="114" fill="#FFF8E7"/>

  <g transform="translate(14 0) scale(0.9)">
    <!-- Rama de café -->
    <path d="M36 196C80 186 150 160 214 118" stroke="#5B4636" stroke-width="7" stroke-linecap="round" fill="none"/>
    <use href="#leaf" transform="translate(58 190) rotate(150)"/>
    <use href="#leaf" transform="translate(64 188) rotate(105)"/>
    <use href="#leaf" transform="translate(90 182) rotate(70)"/>
    <use href="#leaf" transform="translate(176 140) rotate(-80)"/>
    <use href="#leaf" transform="translate(188 132) rotate(-35)"/>
    <use href="#leaf" transform="translate(196 126) rotate(15)"/>
    <use href="#leaf" transform="translate(150 152) rotate(40)"/>

    <!-- Frutos de café -->
    <g fill="url(#cherry)">
      <circle cx="74" cy="178" r="6.5"/><circle cx="83" cy="173" r="6"/><circle cx="80" cy="184" r="6"/>
      <circle cx="166" cy="140" r="6"/><circle cx="176" cy="134" r="6.5"/><circle cx="172" cy="146" r="5.5"/>
    </g>
    <!-- Flores de café -->
    <use href="#flower" transform="translate(52 202)"/>
    <use href="#flower" transform="translate(200 104)"/>
    <use href="#flower" transform="translate(190 152) scale(.8)"/>

    <!-- Cola larga con raquetas -->
    <path d="M110 150C111 176 116 200 123 214L130 212C126 194 124 172 124 148z" fill="url(#tail)"/>
    <path d="M123 212 118 236M129 211 134 236" stroke="#1F4E91" stroke-width="1.6"/>
    <ellipse cx="116" cy="244" rx="6" ry="11" fill="#2E86D6" transform="rotate(8 116 244)"/>
    <ellipse cx="136" cy="244" rx="6" ry="11" fill="#2E86D6" transform="rotate(-8 136 244)"/>
    <path d="M116 234v20M136 234v20" stroke="#14408F" stroke-width="1"/>

    <!-- Cuerpo: pecho verde-amarillo -->
    <path d="M144 70C120 70 96 90 92 120c-3 25 9 42 29 42 20-6 36-32 40-60 3-16-2-28-17-32z" fill="url(#chest)"/>
    <!-- Mancha anaranjada del pecho -->
    <path d="M144 82c-10 2-17 9-18 18 10 0 18-5 22-14z" fill="#E07B2E"/>
    <!-- Ala azul -->
    <path d="M128 82C103 90 90 118 92 145c1 10 9 17 17 18 15-12 27-39 29-65 0-8-3-13-10-16z" fill="url(#wing)"/>
    <path d="M103 114c4 11 6 24 4 36M113 104c4 13 4 28 0 42M122 96c2 13 0 28-5 40" stroke="#9FD6F5" stroke-width="1.2" fill="none" opacity=".7"/>

    <!-- Cabeza -->
    <circle cx="146" cy="60" r="21" fill="#2F8A8A"/>
    <!-- Corona turquesa -->
    <path d="M128 56c4-14 28-20 38-6-10-6-28-6-38 6z" fill="#3FC1D9"/>
    <path d="M131 52c6-6 18-8 28-4-10 0-20 2-28 4z" fill="#123B6B"/>
    <!-- Garganta amarilla -->
    <path d="M150 68c-2 8-6 14-14 18 10 0 16-6 18-14z" fill="#B7CF4A"/>
    <!-- Antifaz negro con borde azul -->
    <path d="M128 60c8-3 24-3 36 2 3 2 2 6-1 7-12 2-26 1-35-3-2-1-2-4 0-6z" fill="#2B6FC9"/>
    <path d="M131 61c8-2 21-2 31 2 2 1 1 3-1 4-10 1-22 1-30-2-1-1-1-3 0-4z" fill="#0B0F14"/>
    <!-- Ojo rojo -->
    <circle cx="148" cy="63" r="4" fill="#C8202B"/>
    <circle cx="147" cy="62" r="1.3" fill="#FFF8E7"/>
    <!-- Pico negro curvo -->
    <path d="M162 58C182 56 198 62 208 72 192 70 178 70 164 70z" fill="#1A1C20"/>
    <path d="M166 66c14 0 28 2 40 5" stroke="#4A4E55" stroke-width="1" fill="none"/>

    <!-- Patas -->
    <path d="M118 160l-2 13M126 159l1 13" stroke="#3A3A3A" stroke-width="2.6" stroke-linecap="round"/>
  </g>
</svg>
